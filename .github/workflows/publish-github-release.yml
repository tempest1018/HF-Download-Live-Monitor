name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable signed tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-github-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify independently trusted signed tag
        env:
          RELEASE_SIGNING_KEY_B64: ${{ vars.RELEASE_SIGNING_KEY_B64 }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          readonly expected_fingerprint="BF317715C9E7B15A750F481A5C53F25769B6CA89"
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          key_file="$RUNNER_TEMP/release-signing-key.asc"
          [[ -n "$RELEASE_SIGNING_KEY_B64" ]]
          printf '%s' "$RELEASE_SIGNING_KEY_B64" | base64 --decode > "$key_file"
          [[ "$(gpg --show-keys --with-colons "$key_file" | awk -F: '$1 == "pub" { count++ } END { print count + 0 }')" == "1" ]]
          [[ "$(gpg --show-keys --with-colons "$key_file" | awk -F: '$1 == "fpr" { print $10; exit }')" == "$expected_fingerprint" ]]
          gpg --batch --import "$key_file"
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "$TAG^{commit}")"
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main
          git verify-tag "$TAG"
      - name: Download and validate draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\t' read -r is_draft is_prerelease release_tag < <(
            gh release view "$TAG" --json isDraft,isPrerelease,tagName \
              --jq '[.isDraft,.isPrerelease,.tagName] | @tsv'
          )
          [[ "$is_draft" == "true" ]]
          [[ "$is_prerelease" == "false" ]]
          [[ "$release_tag" == "$TAG" ]]
          mkdir release-assets
          gh release download "$TAG" --dir release-assets
          python scripts/validate_release_bundle.py release-assets \
            --tag "$TAG" --project-file pyproject.toml
      - name: Publish validated GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false --prerelease=false --latest
