name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable signed tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-github-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify signed tag
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          gpg --batch --import SIGNING_KEY.asc
          git verify-tag "$TAG"
      - name: Download and validate draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\t' read -r is_draft is_prerelease release_tag < <(
            gh release view "$TAG" --json isDraft,isPrerelease,tagName \
              --jq '[.isDraft,.isPrerelease,.tagName] | @tsv'
          )
          [[ "$is_draft" == "true" ]]
          [[ "$is_prerelease" == "false" ]]
          [[ "$release_tag" == "$TAG" ]]
          mkdir release-assets
          gh release download "$TAG" --dir release-assets
          python scripts/validate_release_bundle.py release-assets \
            --tag "$TAG" --project-file pyproject.toml
      - name: Publish validated GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false --prerelease=false --latest
