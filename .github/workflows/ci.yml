name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pyright

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_cli.py tests/test_filesystem.py -q

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: arm64
      - run: python -m pip install -e ".[dev,standalone]"
      - name: Assert native ARM64 runner
        run: python -c "import platform; from scripts.build_standalone import normalized_architecture; assert normalized_architecture(platform.machine()) == 'arm64', platform.machine()"
      - name: Smoke and simulated-download tests
        run: python -m pytest tests/test_cli.py tests/test_filesystem.py tests/integration/test_simulated_download.py -q
      - name: Build Python distributions
        run: python -m build
      - name: Build and smoke standalone
        run: |
          python scripts/build_standalone.py
          python -c "import subprocess; from pathlib import Path; from scripts.build_standalone import artifact_name; import platform; executable = Path('dist') / artifact_name(platform.system(), platform.machine()); subprocess.run([str(executable), '--help'], check=True)"

  windows-macos-arm64:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            os: windows
            arch: arm64
          - runner: macos-15
            os: macos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: arm64
      - run: python -m pip install -e ".[dev,standalone]"
      - name: Assert native ARM64 runner
        run: python -c "import platform; from scripts.build_standalone import normalized_architecture; assert normalized_architecture(platform.machine()) == 'arm64', platform.machine()"
      - name: Smoke and simulated-download tests
        run: python -m pytest tests/test_cli.py tests/test_filesystem.py tests/integration/test_simulated_download.py -q
      - name: Build Python distributions
        run: python -m build
      - name: Build and smoke standalone
        run: |
          python scripts/build_standalone.py
          python -c "import subprocess; from pathlib import Path; from scripts.build_standalone import artifact_name; import platform; executable = Path('dist') / artifact_name(platform.system(), platform.machine()); subprocess.run([str(executable), '--help'], check=True)"

  package:
    needs: [quality, test, macos-smoke, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/hf-download-live-smoke
      - run: /tmp/hf-download-live-smoke/bin/python -m pip install dist/*.whl
      - run: /tmp/hf-download-live-smoke/bin/hf-download-live-monitor --help
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
