name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-and-build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pyright
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/

  publish-pypi:
    needs: verify-and-build-python
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  standalone:
    needs: verify-and-build-python
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: x86_64
            python_arch: x64
            artifact: hf-download-live-monitor-windows-x86_64.exe
          - runner: windows-11-arm
            os: windows
            arch: arm64
            python_arch: arm64
            artifact: hf-download-live-monitor-windows-arm64.exe
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
            python_arch: x64
            artifact: hf-download-live-monitor-linux-x86_64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            python_arch: arm64
            artifact: hf-download-live-monitor-linux-arm64
          - runner: macos-15-intel
            os: macos
            arch: x86_64
            python_arch: x64
            artifact: hf-download-live-monitor-macos-x86_64
          - runner: macos-15
            os: macos
            arch: arm64
            python_arch: arm64
            artifact: hf-download-live-monitor-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}
      - run: python -m pip install -e ".[standalone]"
      - name: Assert runner architecture
        run: python -c "import platform; from scripts.build_standalone import normalized_architecture; assert normalized_architecture(platform.machine()) == '${{ matrix.arch }}', platform.machine()"
      - run: python scripts/build_standalone.py
      - name: Smoke test executable
        run: |
          python -c "import subprocess; executable = r'dist/${{ matrix.artifact }}'; subprocess.run([executable, '--help'], check=True); subprocess.run([executable, 'attach', '--help'], check=True); subprocess.run([executable, 'run', '--help'], check=True)"
      - uses: actions/upload-artifact@v7
        with:
          name: standalone-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256

  github-release:
    needs: [verify-and-build-python, standalone]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256 checksums
        run: find release-assets -type f ! -name '*.sha256' ! -name 'SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
