name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-and-build-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify signed tag
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          gpg --batch --import SIGNING_KEY.asc
          git verify-tag "$GITHUB_REF_NAME"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify tag and project version agree
        run: >-
          python -c "from pathlib import Path; from scripts.validate_release_bundle import
          parse_stable_tag, project_version; assert parse_stable_tag('${{ github.ref_name }}')
          == project_version(Path('pyproject.toml'))"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pyright
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/attest@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/

  standalone:
    needs: verify-and-build-python
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: x86_64
            python_arch: x64
            artifact: hf-download-live-monitor-windows-x86_64.exe
          - runner: windows-11-arm
            os: windows
            arch: arm64
            python_arch: arm64
            artifact: hf-download-live-monitor-windows-arm64.exe
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
            python_arch: x64
            artifact: hf-download-live-monitor-linux-x86_64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            python_arch: arm64
            artifact: hf-download-live-monitor-linux-arm64
          - runner: macos-15-intel
            os: macos
            arch: x86_64
            python_arch: x64
            artifact: hf-download-live-monitor-macos-x86_64
          - runner: macos-15
            os: macos
            arch: arm64
            python_arch: arm64
            artifact: hf-download-live-monitor-macos-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}
      - run: python -m pip install -e ".[standalone]"
      - name: Assert runner architecture
        run: python -c "import platform; from scripts.build_standalone import normalized_architecture; assert normalized_architecture(platform.machine()) == '${{ matrix.arch }}', platform.machine()"
      - run: python scripts/build_standalone.py
      - name: Smoke test executable
        run: |
          python -c "import subprocess; executable = r'dist/${{ matrix.artifact }}'; subprocess.run([executable, '--help'], check=True); subprocess.run([executable, 'attach', '--help'], check=True); subprocess.run([executable, 'run', '--help'], check=True)"
      - uses: actions/attest@v4
        with:
          subject-path: dist/${{ matrix.artifact }}*
      - uses: actions/upload-artifact@v7
        with:
          name: standalone-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256

  validate-release-assets:
    needs: [verify-and-build-python, standalone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          pattern: standalone-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: release-assets
      - name: Validate complete release asset set
        run: >-
          python scripts/validate_release_bundle.py release-assets
          --tag "$GITHUB_REF_NAME" --project-file pyproject.toml --write-aggregate
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-bundle
          path: release-assets/

  stage-github-release:
    needs: [validate-release-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets-bundle
          path: release-assets
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release_state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$release_state" == "false" ]]; then
            echo "refusing to modify public release $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ -z "$release_state" ]]; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes
          fi
          find release-assets -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
