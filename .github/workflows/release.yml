name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-and-build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pyright
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  publish-pypi:
    needs: verify-and-build-python
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  standalone:
    needs: verify-and-build-python
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[standalone]"
      - run: python scripts/build_standalone.py
      - name: Smoke test executable
        shell: bash
        run: |
          exe="dist/hf-live-monitor"
          if [[ "$RUNNER_OS" == "Windows" ]]; then exe="dist/hf-live-monitor.exe"; fi
          "$exe" --help
          "$exe" attach --help
          "$exe" run --help
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ runner.os }}
          path: |
            dist/hf-live-monitor*

  github-release:
    needs: [verify-and-build-python, standalone]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256 checksums
        run: find release-assets -type f ! -name '*.sha256' -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
